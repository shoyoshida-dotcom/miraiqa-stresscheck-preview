<style>
  :root{--paper:#F6F8F3;--ink:#16241B;--sage:#6c7c70;--line:#dee5d8;--green:#1b7f45;--green-deep:#136236;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);

  .sub{color:var(--sage);font-size:.82rem;margin:.3rem 0 2rem;}

  input{font-size:1rem;padding:.85em 1em;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);text-align:center;}
  input:focus{outline:2px solid var(--green);outline-offset:1px;}
  button{font-size:.95rem;font-weight:700;padding:.85em 1em;border:0;border-radius:999px;background:var(--green);color:#fff;cursor:pointer;}
  button:hover{background:var(--green-deep);}
  .err{color:#c0442a;font-size:.84rem;min-height:1.2em;}
  .note{color:var(--sage);font-size:.72rem;margin-top:1.4rem;line-height:1.7;}
</style>

  var ITER = 200000;
  function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  async function deriveKey(pw){
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(DATA.salt),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  }
  async function unlock(pw){
    var key=await deriveKey(pw);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(DATA.iv)},key,b64d(DATA.ct));
    var html=new TextDecoder().decode(pt);
    try{sessionStorage.setItem('miraiqa_pw',pw);}catch(e){}
    document.open();document.write(html);document.close();
  }
  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault();
    var pw=document.getElementById('pw').value;
    unlock(pw).catch(function(){document.getElementById('err').textContent='パスワードが違います';});
  });
  (function(){try{var s=sessionStorage.getItem('miraiqa_pw');if(s)unlock(s).catch(function(){});}catch(e){}})();

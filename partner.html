<title>代理店向け｜WELQA ストレスチェック</title>

<style>
  :root{--paper:#F6F7F9;--ink:#191A1B;--muted:#868D96;--line:#E4E7EC;--brand:#377EF0;--brand-deep:#1F5FD0;--yellow:#F2E338;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);
    font-family:"Manrope","M PLUS 1p","Hiragino Kaku Gothic ProN","Hiragino Sans",system-ui,sans-serif;color:var(--ink);
    background-image:radial-gradient(900px 420px at 50% -10%, #EAF1FE 0%, rgba(246,247,249,0) 70%);}
  .lock{width:min(420px,90vw);text-align:center;padding:2rem;}
  .brand{display:flex;align-items:center;justify-content:center;gap:.6em;}
  .brand img.mark{height:34px;width:auto;}
  .brand img.word{height:22px;width:auto;margin-top:2px;}
  .svc{font-size:.8rem;color:var(--muted);letter-spacing:.08em;margin-top:.7rem;font-weight:700;}
  .sub{color:var(--muted);font-size:.8rem;margin:.5rem 0 2rem;}
  form{display:flex;flex-direction:column;gap:.8rem;}
  input{font-size:1rem;padding:.85em 1em;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);text-align:center;
    font-family:inherit;}
  input:focus{outline:2px solid var(--brand);outline-offset:1px;}
  button{font-size:.95rem;font-weight:700;padding:.85em 1em;border:0;border-radius:999px;background:var(--brand);color:#fff;cursor:pointer;
    font-family:inherit;transition:background .16s ease;}
  button:hover{background:var(--brand-deep);}
  .err{color:#C0442A;font-size:.84rem;min-height:1.2em;}
  .note{color:var(--muted);font-size:.72rem;margin-top:1.4rem;line-height:1.8;}
</style>

  var ITER = 200000;
  function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  async function deriveKey(pw){
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(DATA.salt),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  }
  async function unlock(pw){
    var key=await deriveKey(pw);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(DATA.iv)},key,b64d(DATA.ct));
    var html=new TextDecoder().decode(pt);
    try{sessionStorage.setItem('miraiqa_pw',pw);}catch(e){}
    document.open();document.write(html);document.close();
  }
  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault();
    var pw=document.getElementById('pw').value;
    unlock(pw).catch(function(){document.getElementById('err').textContent='パスワードが違います';});
  });
  (function(){try{var s=sessionStorage.getItem('miraiqa_pw');if(s)unlock(s).catch(function(){});}catch(e){}})();
